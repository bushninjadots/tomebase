services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tomibase
      POSTGRES_USER: tomibase
      POSTGRES_PASSWORD: tomibase_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tomibase']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://tomebase:tomebase_secret@db:5432/tomebase
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_HOST: ${APP_HOST:-localhost:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
